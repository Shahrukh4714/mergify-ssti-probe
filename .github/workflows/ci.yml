name: ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          echo "payload: $(cat payload.txt 2>/dev/null || echo none)"
          if grep -q EVIL payload.txt 2>/dev/null; then
            echo "EVIL content detected"; exit 1
          fi
          echo ok
