queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - base=main
      - label=queue-me
    merge_conditions:
      - check-success=ci
pull_request_rules:
  - name: enqueue-on-label
    conditions:
      - base=main
      - label=queue-me
    actions:
      queue:
        name: default
